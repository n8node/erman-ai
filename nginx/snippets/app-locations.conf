    # WordPress (install, admin, static assets, root PHP)
    location ~ ^/(wp-admin|wp-content|wp-includes|wp-json|wp-login\.php|setup-config\.php|xmlrpc\.php) {
        proxy_pass http://wordpress;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # Workspace access is restricted to an authenticated Erman AI superadmin.
    location = /_workspace_auth {
        internal;
        proxy_pass http://backend/api/v1/workspace/access;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
    }

    # Erman AI owns only the versioned API namespace.
    location ^~ /api/v1/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 960s;
        proxy_connect_timeout 120s;
        proxy_send_timeout 960s;
        proxy_buffering off;
    }

    # AFFiNE 0.27.x emits root-relative auth and storage API URLs.
    location ^~ /api/ {
        auth_request /_workspace_auth;
        rewrite ^ /workspace-app$uri break;
        proxy_pass http://affine:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 960s;
        proxy_send_timeout 960s;
        proxy_buffering off;
        client_max_body_size 100m;
    }

    location /health {
        proxy_pass http://backend/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # AFFiNE workspace (documents + edgeless whiteboards).
    # AFFINE_SERVER_SUB_PATH must match this prefix.
    location = /workspace-app {
        return 301 /workspace-app/;
    }

    # AFFiNE's OIDC action navigates to its login route without server.path.
    location = /login {
        return 302 /workspace-app/login$is_args$args;
    }

    # AFFiNE 0.27.x admin client posts to the domain-root GraphQL endpoint.
    location = /graphql {
        auth_request /_workspace_auth;
        proxy_pass http://affine:3010/workspace-app/graphql;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 960s;
        proxy_buffering off;
        client_max_body_size 100m;
    }

    # AFFiNE 0.27.x drops server.path from its OAuth callback URL.
    location = /oauth/callback {
        auth_request /_workspace_auth;
        proxy_pass http://affine:3010/workspace-app/oauth/callback;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # Fallback for AFFiNE resources loaded from broken root-relative paths.
    location ~ ^/(js|assets|imgs)/ {
        rewrite ^ /workspace-app$uri break;
        proxy_pass http://affine:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Lazy route chunks emit hashed CSS/JS filenames at the domain root.
    location ~ "^/[^/]+\.[0-9a-f]{8}\.(css|js)$" {
        rewrite ^ /workspace-app$uri break;
        proxy_pass http://affine:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # AFFiNE 0.27.3 concatenates subPath and its worker path without a slash.
    location ^~ /workspace-appjs/ {
        rewrite ^/workspace-appjs/(.*)$ /workspace-app/js/$1 break;
        proxy_pass http://affine:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Root-relative icons referenced by AFFiNE's web manifest.
    location ~ ^/(favicon(?:-[0-9]+)?\.png|favicon\.ico|apple-touch-icon\.png)$ {
        rewrite ^ /workspace-app$uri break;
        proxy_pass http://affine:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /workspace-app {
        auth_request /_workspace_auth;
        proxy_pass http://affine:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /workspace-app;
        # AFFiNE 0.27.x does not include server.path in rendered web asset URLs.
        # Disable upstream compression so nginx can repair the HTML at the edge.
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter '<meta content="true" name="env:isSelfHosted">' '<meta content="true" name="env:isSelfHosted"><meta content="/workspace-app" name="env:subPath">';
        sub_filter 'content="/admin/" name="env:publicPath"' 'content="/workspace-app/admin/" name="env:publicPath"';
        sub_filter 'content="/" name="env:publicPath"' 'content="/workspace-app/" name="env:publicPath"';
        sub_filter 'href="/' 'href="/workspace-app/';
        sub_filter 'src="/' 'src="/workspace-app/';
        # AFFiNE may emit root-relative redirects (/admin/setup) even with SUB_PATH set.
        proxy_redirect / /workspace-app/;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        client_max_body_size 100m;

        # The app is embedded only by the same Erman AI origin.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
    }

    location /dashboard {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /_next/ {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://wordpress;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }
