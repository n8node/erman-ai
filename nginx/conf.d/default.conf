resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

upstream backend {
    zone backend_upstream 64k;
    server backend:8080 resolve;
}

upstream frontend {
    zone frontend_upstream 64k;
    server frontend:3000 resolve;
}

upstream wordpress {
    zone wordpress_upstream 64k;
    server wordpress:80 resolve;
}

# HTTP — ACME challenge + redirect to HTTPS
server {
    listen 80;
    server_name erman.ai www.erman.ai;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name erman.ai www.erman.ai;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/snippets/app-locations.conf;
}
