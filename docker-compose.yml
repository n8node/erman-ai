services:
  nginx:
    build: ./nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
      - wordpress
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./certbot-webroot:/var/www/certbot
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      TELEGRAM_ASSETS_DIR: /app/data/telegram
      GEOLOGICAL_JOURNAL_ASSETS_DIR: /app/data/geological-journal
      AUDIO_TRANSCRIPTION_ASSETS_DIR: /app/data/audio-transcription
      VIDEO_TRANSCRIPTION_ASSETS_DIR: /app/data/video-transcription
      JOURNAL_PREPROCESSOR_URL: http://journal-preprocessor:8090
      GEOLOGICAL_JOURNAL_WORKER_CONCURRENCY: ${GEOLOGICAL_JOURNAL_WORKER_CONCURRENCY:-1}
    volumes:
      - telegram_assets:/app/data/telegram
      - geological_journal_assets:/app/data/geological-journal
      - audio_transcription_assets:/app/data/audio-transcription
      - video_transcription_assets:/app/data/video-transcription
    depends_on:
      postgres:
        condition: service_healthy
      journal-preprocessor:
        condition: service_healthy
    restart: unless-stopped

  journal-preprocessor:
    build:
      context: ./journal-preprocessor
      dockerfile: Dockerfile
    environment:
      PORT: "8090"
      LOG_LEVEL: info
      TESSERACT_LANG: rus+eng
    volumes:
      - geological_journal_assets:/app/data/geological-journal
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: /api/v1
      NEXT_PUBLIC_APP_NAME: Erman AI
      INTERNAL_API_URL: http://backend:8080
    depends_on:
      - backend
    restart: unless-stopped

  affine:
    profiles: ["affine"]
    image: ghcr.io/toeverything/affine:${AFFINE_REVISION:-stable}
    env_file: .env
    environment:
      REDIS_SERVER_HOST: affine-redis
      DATABASE_URL: postgresql://${AFFINE_DB_USER:-affine}:${AFFINE_DB_PASSWORD:-change_me_affine_postgres}@affine-postgres:5432/${AFFINE_DB_NAME:-affine}
      AFFINE_INDEXER_ENABLED: "false"
      AFFINE_SERVER_SUB_PATH: /workspace-app
      AFFINE_SERVER_EXTERNAL_URL: ${AFFINE_SERVER_EXTERNAL_URL:-http://localhost/workspace-app}
    volumes:
      - affine_storage:/root/.affine/storage
      - affine_config:/root/.affine/config
    depends_on:
      affine-redis:
        condition: service_healthy
      affine-postgres:
        condition: service_healthy
      affine-migration:
        condition: service_completed_successfully
    restart: unless-stopped

  affine-migration:
    profiles: ["affine"]
    image: ghcr.io/toeverything/affine:${AFFINE_REVISION:-stable}
    command: ["sh", "-c", "node ./scripts/self-host-predeploy.js"]
    env_file: .env
    environment:
      REDIS_SERVER_HOST: affine-redis
      DATABASE_URL: postgresql://${AFFINE_DB_USER:-affine}:${AFFINE_DB_PASSWORD:-change_me_affine_postgres}@affine-postgres:5432/${AFFINE_DB_NAME:-affine}
      AFFINE_INDEXER_ENABLED: "false"
      AFFINE_SERVER_SUB_PATH: /workspace-app
      AFFINE_SERVER_EXTERNAL_URL: ${AFFINE_SERVER_EXTERNAL_URL:-http://localhost/workspace-app}
    volumes:
      - affine_storage:/root/.affine/storage
      - affine_config:/root/.affine/config
    depends_on:
      affine-redis:
        condition: service_healthy
      affine-postgres:
        condition: service_healthy

  affine-redis:
    profiles: ["affine"]
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  affine-postgres:
    profiles: ["affine"]
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${AFFINE_DB_USER:-affine}
      POSTGRES_PASSWORD: ${AFFINE_DB_PASSWORD:-change_me_affine_postgres}
      POSTGRES_DB: ${AFFINE_DB_NAME:-affine}
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - affine_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${AFFINE_DB_USER:-affine}", "-d", "${AFFINE_DB_NAME:-affine}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  wordpress:
    build: ./wordpress
    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_USER: ${WP_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD}
      WORDPRESS_DB_NAME: ${WP_DB_NAME}
      WORDPRESS_CONFIG_EXTRA: |
        define('FS_METHOD', 'direct');
        define('WP_AUTO_UPDATE_CORE', false);
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
            $$_SERVER['HTTPS'] = 'on';
        }
    volumes:
      - wp_uploads:/var/www/html/wp-content/uploads
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: ${WP_DB_NAME}
      MYSQL_USER: ${WP_DB_USER}
      MYSQL_PASSWORD: ${WP_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${WP_DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${WP_DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  mysql_data:
  wp_uploads:
  telegram_assets:
  geological_journal_assets:
  audio_transcription_assets:
  video_transcription_assets:
  affine_postgres_data:
  affine_storage:
  affine_config:
