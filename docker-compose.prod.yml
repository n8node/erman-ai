services:
  nginx:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  wordpress:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mysql:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

